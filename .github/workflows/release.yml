name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes

      - name: Move floating major and minor version tags
        run: |
          major="$(echo "$GITHUB_REF_NAME" | sed -E 's/^(v[0-9]+)\.[0-9]+\.[0-9]+$/\1/')"
          minor="$(echo "$GITHUB_REF_NAME" | sed -E 's/^(v[0-9]+\.[0-9]+)\.[0-9]+$/\1/')"
          git tag -f "$major" "$GITHUB_REF_NAME"
          git tag -f "$minor" "$GITHUB_REF_NAME"
          git push origin "refs/tags/$major" "refs/tags/$minor" --force
